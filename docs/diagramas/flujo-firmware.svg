<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif" viewBox="0 0 760 672" role="img" aria-label="El lazo principal lee el sensor cada 10 ms y nunca se detiene" font-size="13" width="760" height="672"><rect x="0" y="0" width="760" height="672" fill="#FFFFFF"/><defs><marker id="flujo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7A8494"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#14213D">El lazo principal lee el sensor cada 10 ms y nunca se detiene</text><text data-claude-text-id="subtitle" x="24" y="48" font-size="11.5" fill="#4A5568">setup() y loop() de Etapa9.ino</text><text data-claude-text-id="setup-h" x="24" y="78" font-size="11.5" font-weight="600" fill="#4A5568">setup(), una vez</text><g data-claude-anchor="setup"><rect x="24" y="88" width="240" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="s1" x="144" y="112" text-anchor="middle" fill="#14213D">Serie a 115200 baudios</text><rect x="24" y="144" width="240" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="s2" x="144" y="168" text-anchor="middle" fill="#14213D">TFT: aviso de inicio, 3 s</text><rect x="24" y="200" width="240" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="s3" x="144" y="224" text-anchor="middle" fill="#14213D">Filtros y detector de BPM</text><rect x="24" y="256" width="240" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="s4" x="144" y="280" text-anchor="middle" fill="#14213D">initSensor(): MAX30102</text><rect x="24" y="312" width="240" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="s5" x="144" y="336" text-anchor="middle" fill="#14213D">Referencias de P1, P3 y P4</text><text data-claude-text-id="s-note" x="24" y="376" font-size="11.5" fill="#4A5568">Si el sensor no responde, setup()</text><text data-claude-text-id="s-note2" x="24" y="392" font-size="11.5" fill="#4A5568">continúa y loop() lo reintenta</text></g><g data-claude-anchor="decision-sensor"><polygon points="360,112 440,80 520,112 440,144" fill="none" stroke="#7A8494" stroke-width="1.25"></polygon><text data-claude-text-id="d1" x="440" y="116" text-anchor="middle" fill="#14213D">¿sensorReady?</text></g><g data-claude-anchor="decision-10ms"><polygon points="360,212 440,180 520,212 440,244" fill="none" stroke="#7A8494" stroke-width="1.25"></polygon><text data-claude-text-id="d2" x="440" y="216" text-anchor="middle" fill="#14213D">¿Pasaron 10 ms?</text></g><g data-claude-anchor="loop-steps"><rect x="328" y="272" width="224" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="l1" x="440" y="296" text-anchor="middle" fill="#14213D">readFifo(): ráfagas de 10</text><rect x="328" y="328" width="224" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="l2" x="440" y="352" text-anchor="middle" fill="#14213D">processSample() por muestra</text><rect x="328" y="384" width="224" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="l3" x="440" y="408" text-anchor="middle" fill="#14213D">Vigilancia P1 (1 s), P2 (3 s)</text><rect x="328" y="440" width="224" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="l4" x="440" y="464" text-anchor="middle" fill="#14213D">Gráfica y campos de la TFT</text><rect x="328" y="496" width="224" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="l5" x="440" y="520" text-anchor="middle" fill="#14213D">Comandos del Monitor Serie</text><rect x="328" y="552" width="224" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="l6" x="440" y="576" text-anchor="middle" fill="#14213D">Pruebas guiadas t, v, u, w</text><rect x="328" y="608" width="224" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="l7" x="440" y="632" text-anchor="middle" fill="#14213D">Reporte por segundo</text></g><g data-claude-anchor="retry"><rect x="592" y="88" width="144" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="r1a" x="664" y="108" text-anchor="middle" font-size="11.5" fill="#14213D">initSensor()</text><text data-claude-text-id="r1b" x="664" y="124" text-anchor="middle" font-size="11.5" fill="#14213D">cada 5 s</text><rect x="592" y="152" width="144" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="r2a" x="664" y="172" text-anchor="middle" font-size="11.5" fill="#14213D">Comandos y TFT</text><text data-claude-text-id="r2b" x="664" y="188" text-anchor="middle" font-size="11.5" fill="#14213D">pie: NO DETECTADO</text></g><g data-claude-anchor="connectors" fill="none" stroke="#7A8494" stroke-width="1.25"><path d="M144 128V144" marker-end="url(#flujo-arrow)"></path><path d="M144 184V200" marker-end="url(#flujo-arrow)"></path><path d="M144 240V256" marker-end="url(#flujo-arrow)"></path><path d="M144 296V312" marker-end="url(#flujo-arrow)"></path><path d="M264 332H288V112H360" marker-end="url(#flujo-arrow)"></path><path d="M440 144V180" marker-end="url(#flujo-arrow)"></path><path d="M440 244V272" marker-end="url(#flujo-arrow)"></path><path d="M440 312V328" marker-end="url(#flujo-arrow)"></path><path d="M440 368V384" marker-end="url(#flujo-arrow)"></path><path d="M440 424V440" marker-end="url(#flujo-arrow)"></path><path d="M440 480V496" marker-end="url(#flujo-arrow)"></path><path d="M440 536V552" marker-end="url(#flujo-arrow)"></path><path d="M440 592V608" marker-end="url(#flujo-arro