<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif" viewBox="0 0 760 512" role="img" aria-label="El ESP32 concentra todo el procesamiento entre el sensor y la pantalla" font-size="13" width="760" height="512"><rect x="0" y="0" width="760" height="512" fill="#FFFFFF"/><defs><marker id="arq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7A8494"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#14213D">El ESP32 concentra todo el procesamiento entre el sensor y la pantalla</text><text data-claude-text-id="subtitle" x="24" y="48" font-size="11.5" fill="#4A5568">Arquitectura del prototipo, firmware Etapa9.ino</text><g data-claude-anchor="max30102"><rect x="24" y="76" width="168" height="104" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="max-name" x="40" y="100" font-weight="600" fill="#14213D">MAX30102</text><text data-claude-text-id="max-l1" x="40" y="116" font-size="11.5" fill="#4A5568">LED rojo e infrarrojo</text><text data-claude-text-id="max-l2" x="40" y="132" font-size="11.5" fill="#4A5568">Fotodiodo, ADC 18 bits</text><text data-claude-text-id="max-l3" x="40" y="148" font-size="11.5" fill="#4A5568">FIFO de 32 muestras</text><text data-claude-text-id="max-l4" x="40" y="164" font-size="11.5" fill="#4A5568">Dirección I2C 0x57</text></g><g data-claude-anchor="dedo"><rect x="24" y="224" width="168" height="40" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="dedo-name" x="108" y="248" text-anchor="middle" fill="#14213D">Dedo (pulpejo)</text></g><g data-claude-anchor="esp32"><rect x="240" y="72" width="280" height="352" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="esp-name" x="256" y="96" font-size="12" font-weight="600" fill="#14213D">ESP32-WROOM-32, firmware Etapa 9</text><rect x="256" y="108" width="248" height="40" rx="8" fill="none" fill-opacity="1" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="m1" x="380" y="132" text-anchor="middle" fill="#14213D">Adquisición: FIFO cada 10 ms</text><rect x="256" y="160" width="248" height="40" rx="8" fill="none" fill-opacity="1" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="m2" x="380" y="184" text-anchor="middle" fill="#14213D">PPG: DC τ 1 s, filtro 0.5–5 Hz</text><rect x="256" y="212" width="248" height="40" rx="8" fill="none" fill-opacity="1" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="m3" x="380" y="236" text-anchor="middle" fill="#14213D">BPM: pulsos, 8 intervalos</text><rect x="256" y="264" width="248" height="40" rx="8" fill="none" fill-opacity="1" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="m4" x="380" y="288" text-anchor="middle" fill="#14213D">R y SpO₂ experimental</text><rect x="256" y="316" width="248" height="40" rx="8" fill="none" fill-opacity="1" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="m5" x="380" y="340" text-anchor="middle" fill="#14213D">Calidad e interfaz TFT</text><rect x="256" y="368" width="248" height="40" rx="8" fill="none" fill-opacity="1" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="m6" x="380" y="392" text-anchor="middle" fill="#14213D">Vigilancia P1–P4 y diagnóstico</text></g><g data-claude-anchor="connectors" fill="none" stroke="#7A8494" stroke-width="1.25"><path d="M108 224V180" marker-end="url(#arq-arrow)"></path><path d="M192 128H256" marker-end="url(#arq-arrow)"></path><path d="M380 148V160" marker-end="url(#arq-arrow)"></path><path d="M380 200V212" marker-end="url(#arq-arrow)"></path><path d="M380 252V264" marker-end="url(#arq-arrow)"></path><path d="M380 304V316" marker-end="url(#arq-arrow)"></path><path d="M380 368V356" stroke-dasharray="4 3" marker-end="url(#arq-arrow)"></path><path d="M256 388