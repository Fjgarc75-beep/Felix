<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif" viewBox="0 0 760 392" role="img" aria-label="Una sola cadena de filtrado alimenta el BPM y la SpO2" font-size="13" width="760" height="392"><rect x="0" y="0" width="760" height="392" fill="#FFFFFF"/><defs><marker id="ppg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7A8494"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#14213D">Una sola cadena de filtrado alimenta el BPM y la SpO₂</text><text data-claude-text-id="subtitle" x="24" y="48" font-size="11.5" fill="#4A5568">Procesamiento por muestra en processSample(), Etapa9.ino</text><g data-claude-anchor="fila-filtrado"><rect x="40" y="72" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="a1n" x="118" y="92" text-anchor="middle" font-weight="600" fill="#14213D">RED e IR</text><text data-claude-text-id="a1b" x="118" y="109" text-anchor="middle" font-size="11.5" fill="#4A5568">18 bits, 100 por s</text><rect x="220" y="72" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="a2n" x="298" y="92" text-anchor="middle" font-weight="600" fill="#14213D">Resta del DC</text><text data-claude-text-id="a2b" x="298" y="109" text-anchor="middle" font-size="11.5" fill="#4A5568">τ = 1 s</text><rect x="400" y="72" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="a3n" x="478" y="92" text-anchor="middle" font-weight="600" fill="#14213D">Pasa-altas</text><text data-claude-text-id="a3b" x="478" y="109" text-anchor="middle" font-size="11.5" fill="#4A5568">Butterworth 0.5 Hz</text><rect x="580" y="72" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="a4n" x="658" y="92" text-anchor="middle" font-weight="600" fill="#14213D">Pasa-bajas</text><text data-claude-text-id="a4b" x="658" y="109" text-anchor="middle" font-size="11.5" fill="#4A5568">Butterworth 5 Hz</text></g><g data-claude-anchor="fila-bpm"><rect x="40" y="216" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="b1n" x="118" y="236" text-anchor="middle" font-weight="600" fill="#14213D">PPG IR</text><text data-claude-text-id="b1b" x="118" y="253" text-anchor="middle" font-size="11.5" fill="#4A5568">−AC del canal IR</text><rect x="220" y="216" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="b2n" x="298" y="236" text-anchor="middle" font-weight="600" fill="#14213D">Detector</text><text data-claude-text-id="b2b" x="298" y="253" text-anchor="middle" font-size="11.5" fill="#4A5568">umbral y prominencia</text><rect x="400" y="216" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="b3n" x="478" y="236" text-anchor="middle" font-weight="600" fill="#14213D">Intervalo</text><text data-claude-text-id="b3b" x="478" y="253" text-anchor="middle" font-size="11.5" fill="#4A5568">40–180 BPM, ±30 %</text><rect x="580" y="216" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="b4n" x="658" y="236" text-anchor="middle" font-weight="600" fill="#14213D">BPM estable</text><text data-claude-text-id="b4b" x="658" y="253" text-anchor="middle" font-size="11.5" fill="#4A5568">60000 / media de hasta 8</text></g><g data-claude-anchor="fila-spo2"><rect x="40" y="312" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="c1n" x="118" y="332" text-anchor="middle" font-weight="600" fill="#14213D">Búfer de 256</text><text data-claude-text-id="c1b" x="118" y="349" text-anchor="middle" font-size="11.5" fill="#4A5568">AC, DC y validez</text><rect x="220" y="312" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="c2n" x="298" y="332" text-anchor="middle" font-weight="600" fill="#14213D">R por latido</text><text data-claude-text-id="c2b" x="298" y="349" text-anchor="middle" font-size="11.5" fill="#4A5568">regresión RED–IR</text><rect x="400" y="312" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="c3n" x="478" y="332" text-anchor="middle" font-weight="600" fill="#14213D">Calidad</text><text data-claude-text-id="c3b" x="478" y="349" text-anchor="middle" font-size="11.5" fill="#4A5568">5 criterios y rango</text><rect x="580" y="312" width="156" height="48" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text data-claude-text-id="c4n" x="658" y="332" text-anchor="middle" font-weight="600" fill="#14213D">SpO₂ experimental</text><text data-claude-text-id="c4b" x="658" y="349" text-anchor="middle" font-size="11.5" fill="#4A5568">mediana de hasta 8, curva</text></g><g data-claude-anchor="connectors" fill="none" stroke="#7A8494" stroke-width="1.25"><path d="M196 96H220" marker-end="url(#ppg-arrow)"></path><path d="M376 96H400" marker-end="url(#ppg-arrow)"></path><path d="M556 96H580" marker-end="url(#ppg-arrow)"></path><path d="M658 120V168H24V240H40" marker-end="url(#ppg-arrow)"></path><path d="M24 240V336H40" marker-end="url(#ppg-arrow)"></path><path d="M196 240H220" marker-end="url(#ppg-arrow)"></path><path d="M376 240H400" marker-end="url(#ppg-arrow)"></path><path d="M556 240H580" marker-end="url(#ppg-arrow)"></path><path d="M478 264V288H298V312" marker-end="url(#ppg-arrow)"></path><path d="M196 336H220" marker-end="url(#ppg-arrow)"></path><path d="M376 336H400" marker-end="url(#ppg-arrow)"></path><path d="M556 336H580" marker-end="url(#ppg-arrow)"></path></g><text data-claude-text-id="ac-label" x="340" y="160" text-anchor="middle" font-size="11.5" fill="#4A5568">AC filtrada de RED e IR</text><text data-claude-text-id="beat-label" x="488" y="284" font-size="11.5" fill="#4A5568">por intervalo aceptado</text></svg>