<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif" viewBox="0 0 760 560" role="img" aria-label="Conexiones reales del prototipo" font-size="13" width="760" height="560"><rect x="0" y="0" width="760" height="560" fill="#FFFFFF"/><text x="24" y="28" font-size="15" font-weight="600" fill="#14213D">Conexiones reales: el sensor va por I²C y la pantalla por SPI</text><text x="24" y="48" font-size="11.5" fill="#4A5568">Pines tal como están cableados en el prototipo; todo a 3.3 V</text><rect x="24" y="80" width="176" height="300" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text x="40" y="104" font-weight="600" fill="#14213D">MAX30102</text><text x="40" y="120" font-size="11.5" fill="#4A5568">I²C 0x57, 400 kHz</text><rect x="292" y="80" width="176" height="400" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text x="380" y="104" text-anchor="middle" font-weight="600" fill="#14213D">ESP32-WROOM-32</text><rect x="560" y="80" width="176" height="400" rx="8" fill="none" stroke="#7A8494" stroke-width="1.25"></rect><text x="576" y="104" font-weight="600" fill="#14213D">TFT ST7735 1.8&quot;</text><text x="576" y="120" font-size="11.5" fill="#4A5568">SPI 16 MHz</text><g><text x="188" y="150" text-anchor="end" fill="#14213D">VIN</text><text x="304" y="150" fill="#14213D">3.3 V</text><line x1="196" y1="146" x2="300" y2="146" stroke="#7A8494" stroke-width="2"></line><text x="248" y="140" text-anchor="middle" font-size="10.5" fill="#4A5568">Alimentación</text></g><g><text x="188" y="190" text-anchor="end" fill="#14213D">GND</text><text x="304" y="190" fill="#14213D">GND</text><line x1="196" y1="186" x2="300" y2="186" stroke="#7A8494" stroke-width="2"></line><text x="248" y="180" text-anchor="middle" font-size="10.5" fill="#4A5568">Tierra</text></g><g><text x="188" y="230" text-anchor="end" fill="#14213D">SDA</text><text x="304" y="230" fill="#14213D">GPIO21</text><line x1="196" y1="226" x2="300" y2="226" stroke="#1F6F8B" stroke-width="2"></line><text x="248" y="220" text-anchor="middle" font-size="10.5" fill="#4A5568">Datos I²C</text></g><g><text x="188" y="270" text-anchor="end" fill="#14213D">SCL</text><text x="304" y="270" fill="#14213D">GPIO22</text><line x1="196" y1="266" x2="300" y2="266" stroke="#1F6F8B" stroke-width="2"></line><text x="248" y="260" text-anchor="middle" font-size="10.5" fill="#4A5568">Reloj I²C</text></g><g><text x="188" y="310" text-anchor="end" fill="#4A5568">INT (sin conexión)</text></g><g><text x="188" y="350" text-anchor="end" fill="#4A5568">RD (sin conexión)</text></g><g><text x="456" y="150" text-anchor="end" fill="#14213D">3.3 V</text><text x="572" y="150" fill="#14213D">VCC, LED</text><line x1="460" y1="146" x2="566" y2="146" stroke="#7A8494" stroke-width="2"></line><text x="514" y="140" text-anchor="middle" font-size="10.5" fill="#4A5568">Alimentación</text></g><g><text x="456" y="190" text-anchor="end" fill="#14213D">GND</text><text x="572" y="190" fill="#14213D">GND</text><line x1="460" y1="186" x2="566" y2="186" stroke="#7A8494" stroke-width="2"></line><text x="514" y="180" text-anchor="middle" font-size="10.5" fill="#4A5568">Tierra</text></g><g><text x="456" y="230" text-anchor="end" fill="#14213D">GPIO18</text><text x="572" y="230" fill="#14213D">SCK</text><line x1="460" y1="226" x2="566" y2="226" stroke="#C2571A" stroke-width="2"></line><text x="514" y="220" text-anchor="middle" font-size="10.5" fill="#4A5568">Reloj SPI</text></g><g><text x="456" y="270" text-anchor="end" fill="#14213D">GPIO23</text><text x="572" y="270" fill="#14213D">SDA</text><line x1="460" y1="266" x2="566" y2="266" stroke="#C2571A" stroke-width="2"></line><text x="514" y="260" text-anchor="middle" font-size="10.5" fill="#4A5568">MOSI (datos SPI)</text></g><g><text x="456" y="310" text-anchor="end" fill="#14213D">GPIO16</text><text x="572" y="310" fill="#14213D">A0</text><line x1="460" y1="306" x2="566" y2="306" stroke="#C2571A" stroke-width="2"></line><text x="514" y="300" t